name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: `npm test` usa un patrón glob con `node --test`, que Node 20 no admite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # La extensión no tiene dependencias ni package-lock.json, así que no hay `npm ci`
      # (fallaba con EUSAGE). Se publica solo si pasan los tests.
      - name: Tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Publish to VS Code Marketplace
        run: npx -y @vscode/vsce publish --no-dependencies -p ${{ secrets.MARKETPLACE_TOKEN }}
